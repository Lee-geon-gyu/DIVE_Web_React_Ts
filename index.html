<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UI/UX 디자인과 웹 퍼블리싱 입문자를 위한 정보 큐레이션 플랫폼"
    />
    <title>DIVE</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const redirectPath = new URLSearchParams(window.location.search).get(
          "__spa",
        );

        if (!redirectPath) return;

        const baseUrl = "%BASE_URL%".replace(/\/$/, "");

        try {
          const restoredPath = decodeURIComponent(redirectPath);

          if (!restoredPath.startsWith("/")) return;

          window.history.replaceState(null, "", `${baseUrl}${restoredPath}`);
        } catch {
          // Keep the app shell usable if the fallback parameter is malformed.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
